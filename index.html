<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UX Heatmap — AI 시선 예측 분석</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a23;
      --surface-hover: #22222e;
      --border: #2a2a3a;
      --text: #e4e4ed;
      --text-dim: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
    }
    .header h1 {
      font-size: 18px; font-weight: 600;
    }
    .header h1 span { color: var(--accent); }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 100px;
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 600;
    }
    .header-right {
      display: flex; align-items: center; gap: 12px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-dot.connected { background: var(--success); }
    .status-text { font-size: 13px; color: var(--text-dim); }

    /* Layout */
    .app {
      display: flex;
      height: calc(100vh - 65px);
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    /* Upload area */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .upload-zone svg {
      width: 40px; height: 40px;
      stroke: var(--text-dim);
      margin-bottom: 12px;
    }
    .upload-zone.drag-over svg { stroke: var(--accent); }
    .upload-zone p {
      font-size: 14px; color: var(--text-dim);
      line-height: 1.6;
    }
    .upload-zone p strong { color: var(--accent); }
    .upload-zone input { display: none; }

    /* File list */
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    .file-item:hover { background: var(--surface-hover); }
    .file-item.active { background: var(--accent-glow); }
    .file-thumb {
      width: 40px; height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-meta { font-size: 11px; color: var(--text-dim); }
    .file-status {
      font-size: 11px; padding: 2px 8px;
      border-radius: 100px; font-weight: 500;
    }
    .file-status.analyzing {
      background: rgba(251, 191, 36, 0.15); color: #fbbf24;
    }
    .file-status.done {
      background: rgba(34, 197, 94, 0.15); color: var(--success);
    }
    .file-status.waiting {
      background: rgba(136, 136, 160, 0.1); color: var(--text-dim);
    }
    .file-remove {
      background: none; border: none;
      color: var(--text-dim); cursor: pointer; font-size: 16px;
      padding: 4px; border-radius: 4px;
      opacity: 0; transition: all 0.15s;
    }
    .file-item:hover .file-remove { opacity: 1; }
    .file-remove:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

    /* Controls */
    .control-group { margin-bottom: 16px; }
    .control-group label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--text-dim); margin-bottom: 8px;
    }
    .control-group label span { color: var(--text); font-weight: 500; }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: var(--border); border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    select {
      width: 100%; padding: 8px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 13px; outline: none; cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    /* Buttons */
    .btn {
      width: 100%; padding: 10px 16px;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface-hover); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-group { display: flex; gap: 8px; }
    .btn-group .btn { flex: 1; }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tool-btn {
      padding: 6px 12px;
      background: none; border: none;
      color: var(--text-dim); font-size: 13px;
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tool-btn.active { background: var(--accent-glow); color: var(--accent); }
    .toolbar-sep {
      width: 1px; height: 20px;
      background: var(--border); margin: 0 4px;
    }

    /* Canvas area */
    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(99,102,241,0.03) 0%, transparent 70%),
        repeating-conic-gradient(var(--surface) 0% 25%, transparent 0% 50%) 0 0 / 24px 24px;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 40px;
    }
    .empty-icon {
      width: 80px; height: 80px;
      background: var(--surface);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      border: 1px solid var(--border);
    }
    .empty-icon svg { width: 36px; height: 36px; stroke: var(--text-dim); }
    .empty-state h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

    /* Image viewer */
    .viewer {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      display: none;
    }
    .viewer.visible { display: block; }
    .viewer img {
      max-width: 100%;
      max-height: calc(100vh - 200px);
      border-radius: var(--radius);
      display: block;
    }
    .viewer .heatmap-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: var(--radius);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Compare mode */
    .compare-container {
      display: none;
      width: 90%;
      max-height: 90%;
      position: relative;
    }
    .compare-container.visible { display: flex; gap: 16px; }
    .compare-panel {
      flex: 1;
      text-align: center;
    }
    .compare-panel img {
      max-width: 100%;
      max-height: calc(100vh - 240px);
      border-radius: var(--radius);
    }
    .compare-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 19, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-dim); }

    /* Metrics bar */
    .metrics-bar {
      display: none;
      padding: 12px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      gap: 32px;
    }
    .metrics-bar.visible { display: flex; }
    .metric {
      display: flex; flex-direction: column; gap: 2px;
    }
    .metric-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 20px; font-weight: 600; }
    .metric-value.high { color: var(--danger); }
    .metric-value.medium { color: #fbbf24; }
    .metric-value.low { color: var(--success); }

    /* Toast */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 1000;
    }
    .toast {
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">H</div>
      <h1>UX <span>Heatmap</span></h1>
      <span class="badge">DeepGaze IIE</span>
    </div>
    <div class="header-right">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">서버 연결 확인 중...</span>
    </div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">

      <!-- Upload -->
      <div class="sidebar-section">
        <h3>이미지 업로드</h3>
        <div class="upload-zone" id="uploadZone">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
            <path d="M12 16V4m0 0l-4 4m4-4l4 4M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4"/>
          </svg>
          <p>화면 이미지를 드래그하거나<br/><strong>클릭하여 선택</strong></p>
          <input type="file" id="fileInput" accept="image/*" multiple />
        </div>
      </div>

      <!-- File list -->
      <div class="sidebar-section" style="flex:1; overflow-y:auto;">
        <h3>분석 파일 <span id="fileCount"></span></h3>
        <div id="fileList"></div>
      </div>

      <!-- Controls -->
      <div class="sidebar-section">
        <h3>히트맵 설정</h3>
        <div class="control-group">
          <label>투명도 <span id="opacityVal">60%</span></label>
          <input type="range" id="opacitySlider" min="0" max="100" value="60" />
        </div>
        <div class="control-group">
          <label>컬러맵</label>
          <select id="colormapSelect">
            <option value="jet">Jet (기본)</option>
            <option value="hot">Hot</option>
            <option value="inferno">Inferno</option>
            <option value="viridis">Viridis</option>
            <option value="turbo">Turbo</option>
          </select>
        </div>
        <div class="control-group">
          <label>블러 강도 <span id="blurVal">25</span></label>
          <input type="range" id="blurSlider" min="5" max="50" value="25" />
        </div>
      </div>

      <!-- Actions -->
      <div class="sidebar-section">
        <button class="btn btn-primary" id="analyzeBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12l5 5L20 4"/>
          </svg>
          분석 시작
        </button>
        <div class="btn-group" style="margin-top:8px;">
          <button class="btn btn-secondary" id="downloadBtn" disabled>다운로드</button>
          <button class="btn btn-secondary" id="clearBtn" disabled>초기화</button>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="main">
      <!-- Toolbar -->
      <div class="toolbar">
        <button class="tool-btn active" data-view="overlay" onclick="setView('overlay')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          오버레이
        </button>
        <button class="tool-btn" data-view="compare" onclick="setView('compare')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/>
          </svg>
          비교
        </button>
        <button class="tool-btn" data-view="heatmap" onclick="setView('heatmap')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
          </svg>
          히트맵만
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" onclick="zoomIn()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/>
          </svg>
        </button>
        <button class="tool-btn" onclick="zoomOut()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/>
          </svg>
        </button>
        <button class="tool-btn" onclick="zoomReset()">Fit</button>
      </div>

      <!-- Canvas -->
      <div class="canvas-area" id="canvasArea">
        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke="currentColor">
              <path d="M2.036 12.322a1 1 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178a1 1 0 010 .643C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <h2>AI 시선 예측 분석</h2>
          <p>UI 스크린샷을 업로드하면<br/>DeepGaze IIE 모델이 사용자 시선 분포를 예측합니다</p>
        </div>

        <!-- Overlay view -->
        <div class="viewer" id="overlayViewer">
          <img id="originalImg" />
          <canvas class="heatmap-overlay" id="heatmapCanvas"></canvas>
        </div>

        <!-- Compare view -->
        <div class="compare-container" id="compareViewer">
          <div class="compare-panel">
            <img id="compareOriginal" />
            <div class="compare-label">원본</div>
          </div>
          <div class="compare-panel">
            <img id="compareHeatmap" />
            <div class="compare-label">히트맵</div>
          </div>
        </div>

        <!-- Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">DeepGaze IIE 모델 분석 중...</div>
        </div>
      </div>

      <!-- Metrics -->
      <div class="metrics-bar" id="metricsBar">
        <div class="metric">
          <span class="metric-label">최대 주목도</span>
          <span class="metric-value high" id="metricPeak">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">평균 주목도</span>
          <span class="metric-value medium" id="metricAvg">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">집중 영역 비율</span>
          <span class="metric-value" id="metricFocus">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">분석 시간</span>
          <span class="metric-value" id="metricTime">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_URL = 'http://localhost:5000';

    const state = {
      files: [],
      activeIndex: -1,
      currentView: 'overlay',
      zoom: 1,
    };

    // --- Server status ---
    async function checkServer() {
      try {
        const res = await fetch(`${API_URL}/health`);
        if (res.ok) {
          document.getElementById('statusDot').classList.add('connected');
          document.getElementById('statusText').textContent = 'DeepGaze IIE 모델 준비됨';
          return true;
        }
      } catch {}
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = '서버 미연결 — python server.py 실행 필요';
      return false;
    }
    checkServer();
    setInterval(checkServer, 10000);

    // --- File upload ---
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', e => addFiles(e.target.files));

    function addFiles(fileList) {
      for (const file of fileList) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = e => {
          state.files.push({
            name: file.name,
            size: file.size,
            dataUrl: e.target.result,
            file: file,
            status: 'waiting',
            heatmapUrl: null,
            metrics: null,
          });
          renderFileList();
          updateButtons();
          if (state.activeIndex === -1) selectFile(state.files.length - 1);
        };
        reader.readAsDataURL(file);
      }
    }

    function renderFileList() {
      const list = document.getElementById('fileList');
      document.getElementById('fileCount').textContent = state.files.length ? `(${state.files.length})` : '';
      list.innerHTML = state.files.map((f, i) => `
        <div class="file-item ${i === state.activeIndex ? 'active' : ''}" onclick="selectFile(${i})">
          <img class="file-thumb" src="${f.dataUrl}" />
          <div class="file-info">
            <div class="file-name">${f.name}</div>
            <div class="file-meta">${formatSize(f.size)}</div>
          </div>
          <span class="file-status ${f.status}">${statusLabel(f.status)}</span>
          <button class="file-remove" onclick="event.stopPropagation();removeFile(${i})">&times;</button>
        </div>
      `).join('');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function statusLabel(s) {
      return { waiting: '대기', analyzing: '분석 중...', done: '완료' }[s] || s;
    }

    function selectFile(i) {
      state.activeIndex = i;
      renderFileList();
      showImage();
    }

    function removeFile(i) {
      state.files.splice(i, 1);
      if (state.activeIndex >= state.files.length) state.activeIndex = state.files.length - 1;
      renderFileList();
      updateButtons();
      showImage();
    }

    function updateButtons() {
      const has = state.files.length > 0;
      document.getElementById('analyzeBtn').disabled = !has;
      document.getElementById('clearBtn').disabled = !has;
      document.getElementById('downloadBtn').disabled = !state.files.some(f => f.heatmapUrl);
    }

    // --- Image display ---
    function showImage() {
      const f = state.files[state.activeIndex];
      const empty = document.getElementById('emptyState');
      const overlay = document.getElementById('overlayViewer');
      const compare = document.getElementById('compareViewer');

      if (!f) {
        empty.style.display = '';
        overlay.classList.remove('visible');
        compare.classList.remove('visible');
        document.getElementById('metricsBar').classList.remove('visible');
        return;
      }

      empty.style.display = 'none';
      setView(state.currentView);
    }

    function setView(view) {
      state.currentView = view;
      document.querySelectorAll('.tool-btn[data-view]').forEach(b =>
        b.classList.toggle('active', b.dataset.view === view)
      );

      const f = state.files[state.activeIndex];
      if (!f) return;

      const overlay = document.getElementById('overlayViewer');
      const compare = document.getElementById('compareViewer');

      overlay.classList.remove('visible');
      compare.classList.remove('visible');

      if (view === 'overlay' || view === 'heatmap') {
        overlay.classList.add('visible');
        const origImg = document.getElementById('originalImg');
        origImg.src = view === 'heatmap' && f.heatmapUrl ? '' : f.dataUrl;
        origImg.style.opacity = view === 'heatmap' ? 0 : 1;
        origImg.onload = () => updateHeatmapCanvas(f);

        if (!f.heatmapUrl) {
          origImg.src = f.dataUrl;
          origImg.style.opacity = 1;
        }
      } else if (view === 'compare') {
        compare.classList.add('visible');
        document.getElementById('compareOriginal').src = f.dataUrl;
        document.getElementById('compareHeatmap').src = f.heatmapUrl || f.dataUrl;
      }

      if (f.metrics) showMetrics(f.metrics);
      else document.getElementById('metricsBar').classList.remove('visible');
    }

    function updateHeatmapCanvas(f) {
      const canvas = document.getElementById('heatmapCanvas');
      const img = document.getElementById('originalImg');
      if (!f || !f.heatmapUrl) {
        canvas.style.opacity = 0;
        return;
      }

      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      canvas.style.width = img.clientWidth + 'px';
      canvas.style.height = img.clientHeight + 'px';

      const ctx = canvas.getContext('2d');
      const heatImg = new Image();
      heatImg.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(heatImg, 0, 0, canvas.width, canvas.height);
        const opacity = document.getElementById('opacitySlider').value / 100;
        canvas.style.opacity = state.currentView === 'heatmap' ? 1 : opacity;
      };
      heatImg.src = f.heatmapUrl;
    }

    // --- Controls ---
    document.getElementById('opacitySlider').addEventListener('input', e => {
      document.getElementById('opacityVal').textContent = e.target.value + '%';
      const canvas = document.getElementById('heatmapCanvas');
      if (state.currentView !== 'heatmap') canvas.style.opacity = e.target.value / 100;
    });

    document.getElementById('blurSlider').addEventListener('input', e => {
      document.getElementById('blurVal').textContent = e.target.value;
    });

    document.getElementById('colormapSelect').addEventListener('change', () => {
      const f = state.files[state.activeIndex];
      if (f && f.status === 'done') reanalyze(state.activeIndex);
    });

    // --- Analysis ---
    document.getElementById('analyzeBtn').addEventListener('click', analyzeAll);

    async function analyzeAll() {
      const online = await checkServer();
      if (!online) {
        showToast('서버에 연결할 수 없습니다. python server.py를 실행하세요.', 'error');
        return;
      }

      const toAnalyze = state.files.filter(f => f.status !== 'done');
      if (!toAnalyze.length) {
        showToast('모든 파일이 이미 분석되었습니다.', 'success');
        return;
      }

      for (let i = 0; i < state.files.length; i++) {
        if (state.files[i].status === 'done') continue;
        await analyzeSingle(i);
      }

      showToast(`${toAnalyze.length}개 파일 분석 완료`, 'success');
      updateButtons();
    }

    async function analyzeSingle(idx) {
      const f = state.files[idx];
      f.status = 'analyzing';
      renderFileList();
      selectFile(idx);
      showLoading(true, `분석 중: ${f.name}`);

      const startTime = performance.now();
      const formData = new FormData();
      formData.append('image', f.file);
      formData.append('colormap', document.getElementById('colormapSelect').value);
      formData.append('blur', document.getElementById('blurSlider').value);

      try {
        const res = await fetch(`${API_URL}/analyze`, { method: 'POST', body: formData });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);

        f.status = 'done';
        f.heatmapUrl = 'data:image/png;base64,' + data.heatmap;
        f.metrics = { ...data.metrics, time: elapsed + 's' };
        renderFileList();
        showImage();
        showMetrics(f.metrics);
      } catch (err) {
        f.status = 'waiting';
        renderFileList();
        showToast('분석 실패: ' + err.message, 'error');
      }
      showLoading(false);
    }

    async function reanalyze(idx) {
      state.files[idx].status = 'waiting';
      state.files[idx].heatmapUrl = null;
      await analyzeSingle(idx);
      updateButtons();
    }

    // --- Metrics ---
    function showMetrics(m) {
      if (!m) return;
      document.getElementById('metricsBar').classList.add('visible');
      document.getElementById('metricPeak').textContent = m.peak_attention || '—';
      document.getElementById('metricAvg').textContent = m.avg_attention || '—';
      document.getElementById('metricFocus').textContent = m.focus_ratio || '—';
      document.getElementById('metricTime').textContent = m.time || '—';
    }

    // --- Zoom ---
    function zoomIn() {
      state.zoom = Math.min(state.zoom * 1.2, 5);
      applyZoom();
    }
    function zoomOut() {
      state.zoom = Math.max(state.zoom / 1.2, 0.2);
      applyZoom();
    }
    function zoomReset() {
      state.zoom = 1;
      applyZoom();
    }
    function applyZoom() {
      const viewer = document.getElementById('overlayViewer');
      const compare = document.getElementById('compareViewer');
      viewer.style.transform = `scale(${state.zoom})`;
      compare.style.transform = `scale(${state.zoom})`;
    }

    // --- Download ---
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const f = state.files[state.activeIndex];
      if (!f || !f.heatmapUrl) return;

      const canvas = document.createElement('canvas');
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');

        const orig = new Image();
        orig.onload = () => {
          ctx.drawImage(orig, 0, 0, canvas.width, canvas.height);
          ctx.globalAlpha = document.getElementById('opacitySlider').value / 100;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const a = document.createElement('a');
          a.download = `heatmap_${f.name}`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        };
        orig.src = f.dataUrl;
      };
      img.src = f.heatmapUrl;
    });

    // --- Clear ---
    document.getElementById('clearBtn').addEventListener('click', () => {
      state.files = [];
      state.activeIndex = -1;
      renderFileList();
      updateButtons();
      showImage();
    });

    // --- UI Helpers ---
    function showLoading(show, text) {
      const el = document.getElementById('loadingOverlay');
      el.classList.toggle('visible', show);
      if (text) document.getElementById('loadingText').textContent = text;
    }

    function showToast(message, type = '') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }
  </script>
</body>
</html>
